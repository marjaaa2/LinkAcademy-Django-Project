<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxia Coresi</title>
    {% load static %}
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url("{% static 'stars-7249785_1280.webp' %}");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            flex-direction: column;
        }
        
        h1 {
            font-size: 3em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }

        
        .logo {
            position: absolute;
            top: 20px;  
            left: 20px; 
            width: 100px; 
            height: auto; 
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1.5em;
            color: white;
            background-color: rgba(0, 0, 0, 0.7);
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: rgba(0, 0, 0, 0.9);
        }

        footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px 0;
            color: white;
            text-align: center;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    
    <img src="{% static 'whatsapp_image_2024_09_16.jpg' %}" alt="Galaxia Coresi Logo" class="logo">
    
    <h1>Bine ați venit la Galaxia Coresi!</h1>
    
    <form method="POST">
        {% csrf_token %}
        <button type="submit">Implică-te și tu<br>în programele noastre educativ-culturale!</button>
    </form>

    <!-- Footer -->
    <footer>
        © 2024 Galaxia Coresi SRL, galaxiacoresi@yahoo.com<br>
        Design și dezvoltare: Anamaria Poenaru
    </footer>
</body>
</html>
